name: Human-in-the-Loop Module

on:
  pull_request:
    paths:
      - "11-human-in-the-loop/**"
      - ".github/workflows/human-in-the-loop.yml"
  push:
    branches:
      - main
    paths:
      - "11-human-in-the-loop/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 11-human-in-the-loop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 11-human-in-the-loop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
